
name: Build Block Blast APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          if [ -f BlockBlastAndroidProject.zip ]; then
            unzip -o BlockBlastAndroidProject.zip -d .
          fi

      - name: Install colorful Daveblast game with drag controls and saved best score
        shell: bash
        run: |
          cat > app/src/main/java/com/example/blockblast/MainActivity.kt <<'KOTLIN'
          package com.example.blockblast

          import android.app.Activity
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.LinearGradient
          import android.graphics.Shader
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.random.Random

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = android.graphics.Color.rgb(19, 24, 58)
                  window.navigationBarColor = android.graphics.Color.rgb(19, 24, 58)
                  if (Build.VERSION.SDK_INT >= 23) {
                      window.decorView.systemUiVisibility = 0
                  }
                  setContentView(DaveblastView(this))
              }
          }

          private data class Piece(val cells: List<Pair<Int, Int>>, val color: Int)

          private class DaveblastView(context: Context) : View(context) {
              private val prefs = context.getSharedPreferences("daveblast_scores", Context.MODE_PRIVATE)
              private val bgTop = android.graphics.Color.rgb(24, 32, 78)
              private val bgBottom = android.graphics.Color.rgb(92, 49, 145)
              private val white = android.graphics.Color.WHITE
              private val ink = android.graphics.Color.rgb(32, 37, 77)
              private val muted = android.graphics.Color.rgb(125, 132, 164)
              private val emptyCell = android.graphics.Color.rgb(235, 239, 255)
              private val colors = listOf(
                  android.graphics.Color.rgb(75, 132, 255),
                  android.graphics.Color.rgb(255, 174, 55),
                  android.graphics.Color.rgb(41, 199, 153),
                  android.graphics.Color.rgb(185, 93, 255),
                  android.graphics.Color.rgb(255, 91, 126),
                  android.graphics.Color.rgb(40, 199, 218),
                  android.graphics.Color.rgb(255, 113, 66)
              )
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val board = Array(10) { IntArray(10) }
              private var score = 0
              private var best = prefs.getInt("best_score", 0)
              private var gameOver = false
              private var boardLeft = 0f
              private var boardTop = 0f
              private var cell = 0f
              private var boardSize = 0f
              private var trayTop = 0f
              private var trayBottom = 0f
              private var dragging = -1
              private var dragX = 0f
              private var dragY = 0f
              private var validDrop = false
              private var selectedRow = -1
              private var selectedCol = -1

              private val shapes = listOf(
                  listOf(0 to 0), listOf(0 to 0, 1 to 0), listOf(0 to 0, 0 to 1),
                  listOf(0 to 0, 1 to 0, 2 to 0), listOf(0 to 0, 0 to 1, 0 to 2),
                  listOf(0 to 0, 1 to 0, 0 to 1, 1 to 1),
                  listOf(0 to 0, 1 to 0, 2 to 0, 0 to 1),
                  listOf(0 to 0, 1 to 0, 2 to 0, 1 to 1),
                  listOf(0 to 0, 0 to 1, 0 to 2, 1 to 2),
                  listOf(0 to 0, 1 to 0, 2 to 0, 2 to 1),
                  listOf(0 to 0, 1 to 0, 2 to 0, 0 to 1, 1 to 1, 2 to 1),
                  listOf(0 to 0, 0 to 1, 1 to 1, 1 to 2),
                  listOf(0 to 0, 1 to 0, 2 to 0, 0 to 1, 0 to 2),
                  listOf(0 to 0, 1 to 0, 1 to 1, 2 to 1),
                  listOf(0 to 0, 0 to 1, 0 to 2, 1 to 0, 1 to 1, 1 to 2)
              )
              private val pieces = MutableList(3) { randomPiece() }

              private fun randomPiece(): Piece = Piece(shapes[Random.nextInt(shapes.size)], colors.random())

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  paint.shader = LinearGradient(0f, 0f, width.toFloat(), height.toFloat(), bgTop, bgBottom, Shader.TileMode.CLAMP)
                  canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), paint)
                  paint.shader = null
                  paint.color = android.graphics.Color.argb(22, 255, 255, 255)
                  canvas.drawCircle(width * .05f, height * .16f, width * .23f, paint)
                  canvas.drawCircle(width * .98f, height * .44f, width * .27f, paint)

                  drawText(canvas, "DAVE", width * .5f, height * .052f, width * .095f, white, true, Paint.Align.CENTER)
                  drawText(canvas, "B L A S T", width * .5f, height * .085f, width * .046f, android.graphics.Color.rgb(255, 208, 87), true, Paint.Align.CENTER)
                  drawText(canvas, "Drag blocks • Clear lines • Beat your best", width * .5f, height * .107f, width * .031f, android.graphics.Color.rgb(221, 224, 255), false, Paint.Align.CENTER)

                  val cardY = height * .125f
                  val cardH = height * .064f
                  val gap = width * .035f
                  val cardW = (width - gap * 3f) / 2f
                  rounded(canvas, gap, cardY, gap + cardW, cardY + cardH, 20f, android.graphics.Color.argb(245, 255, 255, 255))
                  rounded(canvas, gap * 2f + cardW, cardY, width - gap, cardY + cardH, 20f, android.graphics.Color.argb(245, 255, 255, 255))
                  drawText(canvas, "SCORE", gap + cardW * .28f, cardY + cardH * .38f, width * .027f, muted, true, Paint.Align.CENTER)
                  drawText(canvas, score.toString(), gap + cardW * .70f, cardY + cardH * .69f, width * .061f, ink, true, Paint.Align.CENTER)
                  drawText(canvas, "BEST", gap * 2f + cardW * .28f, cardY + cardH * .38f, width * .027f, muted, true, Paint.Align.CENTER)
                  drawText(canvas, best.toString(), gap * 2f + cardW * .70f, cardY + cardH * .69f, width * .061f, ink, true, Paint.Align.CENTER)

                  boardSize = min(width * .89f, height * .405f)
                  cell = boardSize / 10f
                  boardLeft = (width - boardSize) / 2f
                  boardTop = height * .215f
                  rounded(canvas, boardLeft - 7f, boardTop - 7f, boardLeft + boardSize + 7f, boardTop + boardSize + 7f, 22f, android.graphics.Color.argb(90, 15, 19, 50))
                  rounded(canvas, boardLeft - 4f, boardTop - 4f, boardLeft + boardSize + 4f, boardTop + boardSize + 4f, 19f, white)
                  for (r in 0 until 10) for (c in 0 until 10) {
                      val l = boardLeft + c * cell + 1.7f
                      val t = boardTop + r * cell + 1.7f
                      val right = l + cell - 3.4f
                      val bottom = t + cell - 3.4f
                      val value = board[r][c]
                      rounded(canvas, l, t, right, bottom, cell * .14f, if (value == 0) emptyCell else value)
                      if (value != 0) rounded(canvas, l + 2f, t + 2f, right - 2f, t + cell * .23f, cell * .1f, lighten(value))
                  }

                  val labelY = boardTop + boardSize + height * .033f
                  drawText(canvas, "PICK UP A BLOCK AND DRAG IT HERE", width * .5f, labelY, width * .031f, white, true, Paint.Align.CENTER)
                  trayTop = labelY + height * .018f
                  trayBottom = height - height * .022f
                  val slotW = width / 3f
                  for (i in 0..2) {
                      val l = slotW * i + width * .018f
                      val r = slotW * (i + 1) - width * .018f
                      rounded(canvas, l, trayTop, r, trayBottom, 22f, android.graphics.Color.argb(if (dragging == i) 125 else 242, 255, 255, 255))
                      if (pieces[i].cells.isNotEmpty() && dragging != i) {
                          drawPiece(canvas, pieces[i], (l + r) / 2f, (trayTop + trayBottom) / 2f - 5f, min(width * .045f, cell * .56f))
                      }
                      drawText(canvas, if (pieces[i].cells.isEmpty()) "✓" else "DRAG", (l + r) / 2f, trayBottom - 12f, width * .025f, muted, true, Paint.Align.CENTER)
                  }
                  if (dragging >= 0 && pieces[dragging].cells.isNotEmpty()) {
                      val piece = pieces[dragging]
                      val origin = dragOrigin(piece, dragX, dragY)
                      validDrop = canPlace(piece, origin.first, origin.second)
                      val previewColor = if (validDrop) piece.color else android.graphics.Color.rgb(255, 91, 126)
                      drawPiece(canvas, piece.copy(color = previewColor), boardLeft + (origin.second + shapeWidth(piece) / 2f) * cell,
                          boardTop + (origin.first + shapeHeight(piece) / 2f) * cell, cell * .88f, .68f)
                      drawPiece(canvas, piece, dragX, dragY - cell * 1.7f, min(width * .045f, cell * .56f), .95f)
                  }

                  if (gameOver) {
                      paint.color = android.graphics.Color.argb(185, 13, 16, 42)
                      canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), paint)
                      rounded(canvas, width * .09f, height * .36f, width * .91f, height * .62f, 28f, white)
                      drawText(canvas, "NICE RUN!", width / 2f, height * .415f, width * .075f, ink, true, Paint.Align.CENTER)
                      drawText(canvas, "Score  $score     Best  $best", width / 2f, height * .455f, width * .043f, muted, true, Paint.Align.CENTER)
                      rounded(canvas, width * .23f, height * .50f, width * .77f, height * .565f, 20f, colors[0])
                      drawText(canvas, "PLAY AGAIN", width / 2f, height * .54f, width * .041f, white, true, Paint.Align.CENTER)
                  }
              }

              private fun shapeWidth(p: Piece) = p.cells.maxOf { it.first } + 1
              private fun shapeHeight(p: Piece) = p.cells.maxOf { it.second } + 1
              private fun dragOrigin(p: Piece, x: Float, y: Float): Pair<Int, Int> {
                  val col = ((x - boardLeft) / cell - shapeWidth(p) / 2f).toInt()
                  val row = ((y - boardTop) / cell - shapeHeight(p) / 2f).toInt()
                  return row to col
              }

              private fun drawPiece(canvas: Canvas, piece: Piece, centerX: Float, centerY: Float, unit: Float, alpha: Float = 1f) {
                  val maxX = shapeWidth(piece)
                  val maxY = shapeHeight(piece)
                  val startX = centerX - maxX * unit / 2f
                  val startY = centerY - maxY * unit / 2f
                  for ((x, y) in piece.cells) {
                      val l = startX + x * unit + 1f
                      val t = startY + y * unit + 1f
                      paint.alpha = (255 * alpha).toInt()
                      rounded(canvas, l, t, l + unit - 2f, t + unit - 2f, unit * .18f, piece.color)
                      rounded(canvas, l + unit * .12f, t + unit * .10f, l + unit * .80f, t + unit * .27f, unit * .10f, lighten(piece.color))
                      paint.alpha = 255
                  }
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (event.action == MotionEvent.ACTION_DOWN) {
                      if (gameOver) return true
                      if (event.y >= trayTop && event.y <= trayBottom) {
                          val slot = (event.x / (width / 3f)).toInt().coerceIn(0, 2)
                          if (pieces[slot].cells.isNotEmpty()) {
                              dragging = slot
                              dragX = event.x
                              dragY = event.y
                              parent?.requestDisallowInterceptTouchEvent(true)
                              invalidate()
                          }
                      }
                      return true
                  }
                  if (event.action == MotionEvent.ACTION_MOVE && dragging >= 0) {
                      dragX = event.x
                      dragY = event.y
                      val o = dragOrigin(pieces[dragging], dragX, dragY)
                      validDrop = canPlace(pieces[dragging], o.first, o.second)
                      invalidate()
                      return true
                  }
                  if (event.action == MotionEvent.ACTION_UP) {
                      if (gameOver) {
                          if (event.y in (height * .36f)..(height * .62f)) resetGame()
                          invalidate()
                          return true
                      }
                      if (dragging >= 0) {
                          val index = dragging
                          val piece = pieces[index]
                          val o = dragOrigin(piece, event.x, event.y)
                          if (event.x >= boardLeft && event.x <= boardLeft + boardSize && event.y >= boardTop && event.y <= boardTop + boardSize && canPlace(piece, o.first, o.second)) {
                              placePiece(index, o.first, o.second)
                          }
                          dragging = -1
                          invalidate()
                          return true
                      }
                      return true
                  }
                  if (event.action == MotionEvent.ACTION_CANCEL) {
                      dragging = -1
                      invalidate()
                      return true
                  }
                  return true
              }

              private fun canPlace(piece: Piece, row: Int, col: Int): Boolean {
                  if (row < 0 || col < 0) return false
                  return piece.cells.all { (x, y) ->
                      val rr = row + y
                      val cc = col + x
                      rr in 0..9 && cc in 0..9 && board[rr][cc] == 0
                  }
              }

              private fun placePiece(index: Int, row: Int, col: Int) {
                  val piece = pieces[index]
                  if (!canPlace(piece, row, col)) return
                  for ((x, y) in piece.cells) board[row + y][col + x] = piece.color
                  score += piece.cells.size
                  val fullRows = (0..9).filter { r -> (0..9).all { c -> board[r][c] != 0 } }
                  val fullCols = (0..9).filter { c -> (0..9).all { r -> board[r][c] != 0 } }
                  for (r in fullRows) for (c in 0..9) board[r][c] = 0
                  for (c in fullCols) for (r in 0..9) board[r][c] = 0
                  val cleared = fullRows.size + fullCols.size
                  if (cleared > 0) {
                      score += cleared * 10 + if (cleared >= 2) cleared * 5 else 0
                      vibrate()
                  }
                  if (score > best) {
                      best = score
                      prefs.edit().putInt("best_score", best).apply()
                  }
                  pieces[index] = Piece(emptyList(), piece.color)
                  if (pieces.all { it.cells.isEmpty() }) for (i in 0..2) pieces[i] = randomPiece()
                  gameOver = pieces.filter { it.cells.isNotEmpty() }.none { p -> anyFit(p) }
              }

              private fun anyFit(piece: Piece): Boolean {
                  for (r in 0..9) for (c in 0..9) if (canPlace(piece, r, c)) return true
                  return false
              }

              private fun resetGame() {
                  for (r in 0..9) board[r].fill(0)
                  score = 0
                  gameOver = false
                  dragging = -1
                  for (i in 0..2) pieces[i] = randomPiece()
              }

              private fun vibrate() {
                  try {
                      @Suppress("DEPRECATION")
                      val v = context.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      if (v != null && v.hasVibrator()) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) v.vibrate(VibrationEffect.createOneShot(45, VibrationEffect.DEFAULT_AMPLITUDE))
                          else {
                              @Suppress("DEPRECATION")
                              v.vibrate(45)
                          }
                      }
                  } catch (_: Exception) { }
              }

              private fun rounded(canvas: Canvas, l: Float, t: Float, r: Float, b: Float, radius: Float, color: Int) {
                  paint.shader = null
                  paint.style = Paint.Style.FILL
                  paint.color = color
                  paint.alpha = 255
                  canvas.drawRoundRect(RectF(l, t, r, b), radius, radius, paint)
              }

              private fun drawText(canvas: Canvas, text: String, x: Float, y: Float, size: Float, color: Int, bold: Boolean, align: Paint.Align) {
                  paint.shader = null
                  paint.color = color
                  paint.alpha = 255
                  paint.textSize = size
                  paint.typeface = if (bold) android.graphics.Typeface.create("sans-serif", android.graphics.Typeface.BOLD) else android.graphics.Typeface.create("sans-serif", android.graphics.Typeface.NORMAL)
                  paint.textAlign = align
                  canvas.drawText(text, x, y, paint)
              }

              private fun lighten(color: Int): Int {
                  val r = min(255, android.graphics.Color.red(color) + 45)
                  val g = min(255, android.graphics.Color.green(color) + 45)
                  val b = min(255, android.graphics.Color.blue(color) + 45)
                  return android.graphics.Color.rgb(r, g, b)
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="Block Blast"', 'android:label="Daveblast"')
          p.write_text(s)
          print("Daveblast source and app label installed")
          PY

      - name: Add Block Blast launcher icon
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path("app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              candidates = list(Path(".").glob("**/src/main/AndroidManifest.xml"))
              candidates = [p for p in candidates if ".gradle" not in str(p)]
              if not candidates:
                  raise SystemExit("AndroidManifest.xml not found")
              manifest = candidates[0]

          res = manifest.parent / "res"
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)

          icon = drawable / "ic_launcher.xml"
          icon.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#101820" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#F9C80E" android:pathData="M18,18h30v30h-30z"/>
              <path android:fillColor="#F86624" android:pathData="M54,18h36v18h-36z"/>
              <path android:fillColor="#EA3546" android:pathData="M54,42h18v30h-18z"/>
              <path android:fillColor="#43BCCD" android:pathData="M18,54h30v18h-30z"/>
              <path android:fillColor="#43BCCD" android:pathData="M18,78h18v12h-18z"/>
              <path android:fillColor="#7CB518" android:pathData="M42,78h48v12h-48z"/>
              <path android:fillColor="#F86624" android:pathData="M78,42h12v30h-12z"/>
          </vector>
          """, encoding="utf-8")

          text = manifest.read_text(encoding="utf-8")
          app_match = re.search(r"<application\b[^>]*>", text, re.S)
          if not app_match:
              raise SystemExit("Could not find application tag in AndroidManifest.xml")
          tag = app_match.group(0)
          tag = re.sub(r'\s+android:icon="[^"]*"', "", tag)
          tag = re.sub(r'\s+android:roundIcon="[^"]*"', "", tag)
          tag = tag[:-1] + ' android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher">'
          text = text[:app_match.start()] + tag + text[app_match.end():]
          manifest.write_text(text, encoding="utf-8")
          print(f"Launcher icon added and manifest updated: {manifest}")
          PY

      - name: Diagnose launcher and app startup code
        shell: bash
        run: |
          echo "=== Android manifest ==="
          for file in $(find . -path '*/src/main/AndroidManifest.xml' -not -path '*/.gradle/*'); do
            echo "=== MANIFEST: $file ==="
            sed -n '1,220p' "$file"
          done
          echo "=== App source files ==="
          find app/src/main -type f -name '*.kt' -print
          find app/src/main -type f -name '*.java' -print
          while IFS= read -r file; do
            echo "=== SOURCE: $file ==="
            sed -n '1,260p' "$file"
          done < <(find app/src/main -type f \( -name '*.kt' -o -name '*.java' \) -not -path '*/.gradle/*' | head -20)

      - name: Find Android project
        run: |
          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "Searching for Android project..."
            find . -type f \( \
              -name build.gradle -o \
              -name build.gradle.kts \
            \) -not -path '*/.gradle/*'
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts was not found."
            echo "Check that the Android project files are uploaded."
            exit 1
          fi

      - name: Fix Java and Kotlin JVM targets
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("app/build.gradle.kts"),
              Path("app/build.gradle")
          ]

          build_file = next(
              (p for p in candidates if p.is_file()),
              None
          )

          if build_file is None:
              raise SystemExit("App Gradle file not found")

          text = build_file.read_text()

          if build_file.suffix == ".kts":
              block = """compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }"""
          else:
              block = """compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }"""

          pattern = r"compileOptions\s*\{[^}]*\}"

          if re.search(pattern, text, re.S):
              text = re.sub(
                  pattern,
                  lambda _: block,
                  text,
                  count=1,
                  flags=re.S
              )
          else:
              match = re.search(r"\bandroid\s*\{", text)

              if not match:
                  raise SystemExit(
                      "Could not find the Android Gradle block"
                  )

              text = (
                  text[:match.end()]
                  + "\n    "
                  + block
                  + "\n"
                  + text[match.end():]
              )

          # Align Kotlin JVM target when the Kotlin DSL is used.
          if build_file.suffix == ".kts":
              kotlin_pattern = (
                  r"kotlinOptions\s*\{[^}]*\}"
              )

              kotlin_block = """kotlinOptions {
                  jvmTarget = "17"
              }"""

              if re.search(kotlin_pattern, text, re.S):
                  text = re.sub(
                      kotlin_pattern,
                      lambda _: kotlin_block,
                      text,
                      count=1,
                      flags=re.S
                  )

          build_file.write_text(text)
          print("Updated:", build_file)
          print("Java compatibility target: 17")
          PY

      - name: Enforce matching Java and Kotlin JVM targets
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          candidates = [Path("app/build.gradle"), Path("app/build.gradle.kts")]
          build_file = next((p for p in candidates if p.is_file()), None)
          if build_file is None:
              raise SystemExit("App Gradle file not found")

          text = build_file.read_text()
          if build_file.suffix == ".kts":
              snippet = """
          // Keep Java and Kotlin bytecode targets aligned for CI builds.
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          else:
              snippet = """
          // Keep Java and Kotlin bytecode targets aligned for CI builds.
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          if "Keep Java and Kotlin bytecode targets aligned for CI builds." not in text:
              text += "\n" + snippet + "\n"
          build_file.write_text(text)
          print(f"Enforced Kotlin JVM target 17 in {build_file}")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Do not request the removed legacy "tools" SDK package.
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Name APK Daveblast.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Daveblast.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daveblast-APK
          path: app/build/outputs/apk/debug/Daveblast.apk
          if-no-files-found: error
          retention-days: 7
