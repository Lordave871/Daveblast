
name: Build Block Blast APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          if [ -f BlockBlastAndroidProject.zip ]; then
            unzip -o BlockBlastAndroidProject.zip -d .
          fi

      - name: Install polished Daveblast game UI, settings and drag controls
        shell: bash
        run: |
          cat > app/src/main/java/com/example/blockblast/MainActivity.kt <<'KOTLIN'
          package com.example.blockblast

          import android.app.Activity
          import android.content.Context
          import android.graphics.*
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.min
          import kotlin.random.Random

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(38, 64, 128)
                  window.navigationBarColor = Color.rgb(38, 64, 128)
                  setContentView(DaveblastView(this))
              }
          }

          private data class Piece(val cells: List<Pair<Int, Int>>, val color: Int)

          private class DaveblastView(context: Context) : View(context) {
              private val prefs = context.getSharedPreferences("daveblast_scores", Context.MODE_PRIVATE)
              private val blue = Color.rgb(57, 88, 157)
              private val boardColor = Color.rgb(25, 35, 79)
              private val gold = Color.rgb(255, 196, 48)
              private val palette = listOf(Color.rgb(47,111,255), Color.rgb(255,151,35), Color.rgb(42,208,102), Color.rgb(183,75,244), Color.rgb(246,66,76), Color.rgb(34,202,222), Color.rgb(255,202,55))
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val board = Array(8) { IntArray(8) }
              private var score = 0
              private var best = prefs.getInt("best_score", 0)
              private var sound = prefs.getBoolean("sound_on", true)
              private var vibration = prefs.getBoolean("vibration_on", true)
              private var settings = false
              private var scores = false
              private var over = false
              private var left = 0f
              private var top = 0f
              private var size = 0f
              private var unit = 0f
              private var trayTop = 0f
              private var trayBottom = 0f
              private var dragging = -1
              private var dx = 0f
              private var dy = 0f
              private val gearHit = RectF()
              private val closeHit = RectF()
              private val soundHit = RectF()
              private val vibrationHit = RectF()
              private val restartHit = RectF()
              private val tone = try { ToneGenerator(AudioManager.STREAM_MUSIC, 45) } catch (_: Exception) { null }
              private var history = prefs.getString("history", "")!!.split(",").mapNotNull { it.toIntOrNull() }.sortedDescending().take(5)
              private val shapes = listOf(
                  listOf(0 to 0), listOf(0 to 0,1 to 0), listOf(0 to 0,0 to 1),
                  listOf(0 to 0,1 to 0,2 to 0), listOf(0 to 0,0 to 1,0 to 2),
                  listOf(0 to 0,1 to 0,0 to 1,1 to 1), listOf(0 to 0,1 to 0,2 to 0,0 to 1),
                  listOf(0 to 0,1 to 0,2 to 0,1 to 1), listOf(0 to 0,0 to 1,0 to 2,1 to 2),
                  listOf(0 to 0,1 to 0,2 to 0,2 to 1), listOf(0 to 0,1 to 0,2 to 0,0 to 1,1 to 1,2 to 1),
                  listOf(0 to 0,0 to 1,1 to 1,1 to 2), listOf(0 to 0,1 to 0,2 to 0,0 to 1,0 to 2),
                  listOf(0 to 0,1 to 0,1 to 1,2 to 1), listOf(0 to 0,0 to 1,0 to 2,1 to 0,1 to 1,1 to 2)
              )
              private val pieces = MutableList(3) { randomPiece() }
              private fun randomPiece() = Piece(shapes.random(), palette.random())
              private fun w(a: Piece) = (a.cells.maxOfOrNull { it.first } ?: 0) + 1
              private fun h(a: Piece) = (a.cells.maxOfOrNull { it.second } ?: 0) + 1

              override fun onDraw(c: Canvas) {
                  super.onDraw(c)
                  p.shader = LinearGradient(0f,0f,width.toFloat(),height.toFloat(),Color.rgb(57,91,166),Color.rgb(39,61,119),Shader.TileMode.CLAMP)
                  c.drawRect(0f,0f,width.toFloat(),height.toFloat(),p); p.shader = null
                  p.shader = RadialGradient(width*.5f,height*.44f,width*.68f,intArrayOf(Color.argb(30,139,177,255),Color.argb(0,139,177,255)),null,Shader.TileMode.CLAMP)
                  c.drawRect(0f,0f,width.toFloat(),height.toFloat(),p); p.shader = null
                  crown(c,width*.10f,height*.047f,width*.04f)
                  text(c,best.toString(),width*.16f,height*.053f,width*.043f,gold,true,Paint.Align.LEFT)
                  gear(c,width*.90f,height*.048f,width*.033f)
                  text(c,score.toString(),width*.5f,height*.105f,width*.105f,Color.WHITE,true,Paint.Align.CENTER)
                  text(c,"D A V E B L A S T",width*.5f,height*.14f,width*.039f,Color.WHITE,true,Paint.Align.CENTER)
                  text(c,"CLASSIC BLOCK PUZZLE",width*.5f,height*.166f,width*.025f,Color.rgb(205,218,250),false,Paint.Align.CENTER)
                  size = min(width*.91f,height*.405f); unit = size/8f
                  left = (width-size)/2f; top = height*.215f
                  round(c,left-5,top-5,left+size+5,top+size+5,16f,Color.argb(55,7,15,45))
                  round(c,left-2,top-2,left+size+2,top+size+2,12f,Color.rgb(61,86,151))
                  round(c,left,top,left+size,top+size,9f,boardColor)
                  for (r in 0..7) for (col in 0..7) {
                      val x=left+col*unit+1.5f; val y=top+r*unit+1.5f; val color=board[r][col]
                      if(color==0) {
                          round(c,x,y,x+unit-3,y+unit-3,unit*.09f,Color.rgb(32,45,91))
                      } else {
                          drawBlock(c,x,y,unit-3,unit-4,color)
                      }
                  }
                  text(c,"DRAG A BLOCK TO THE BOARD",width*.5f,top+size+height*.035f,width*.027f,Color.rgb(224,232,255),true,Paint.Align.CENTER)
                  trayTop=top+size+height*.055f; trayBottom=height*.965f
                  for(i in 0..2) {
                      val l=width/3f*i+width*.018f; val r=width/3f*(i+1)-width*.018f
                      if(dragging==i) {
                          p.color=Color.argb(28,255,255,255)
                          c.drawRoundRect(RectF(l,trayTop,r,trayBottom),17f,17f,p)
                      }
                      if(pieces[i].cells.isNotEmpty() && dragging!=i) {
                          val availableH=trayBottom-trayTop-height*.045f
                          val scale=min(width*.075f, min((r-l)*.22f,availableH*.22f))
                          drawPiece(c,pieces[i],(l+r)/2f,(trayTop+trayBottom)/2f-height*.015f,scale)
                      }
                      if(pieces[i].cells.isEmpty()) {
                          text(c,"✓",(l+r)/2f,(trayTop+trayBottom)/2f,width*.06f,Color.rgb(150,235,190),true,Paint.Align.CENTER)
                      }
                  }
                  if(dragging>=0 && pieces[dragging].cells.isNotEmpty()) {
                      val a=pieces[dragging]; val o=origin(a,dx,dy)
                      val valid=can(a,o.first,o.second)
                      drawPiece(c,a.copy(color=if(valid)a.color else Color.rgb(255,75,95)),left+(o.second+w(a)/2f)*unit,top+(o.first+h(a)/2f)*unit,unit*.9f,.78f)
                      drawPiece(c,a,dx,dy-unit*1.5f,min(width*.046f,unit*.55f))
                  }
                  if(settings) drawSettings(c)
                  if(scores) drawScores(c)
                  if(over) drawOver(c)
              }

              private fun gear(c:Canvas,x:Float,y:Float,r:Float) {
                  p.style=Paint.Style.STROKE; p.strokeWidth=r*.22f; p.color=Color.WHITE
                  c.drawCircle(x,y,r*.68f,p); c.drawCircle(x,y,r*.23f,p)
                  for(i in 0..7) { val a=i*Math.PI/4; c.drawLine(x+kotlin.math.cos(a).toFloat()*r*.75f,y+kotlin.math.sin(a).toFloat()*r*.75f,x+kotlin.math.cos(a).toFloat()*r,y+kotlin.math.sin(a).toFloat()*r,p) }
                  p.style=Paint.Style.FILL; gearHit.set(x-r*1.8f,y-r*1.8f,x+r*1.8f,y+r*1.8f)
              }
              private fun crown(c:Canvas,x:Float,y:Float,s:Float) {
                  p.color=gold
                  val path=Path(); path.moveTo(x-s,y-s*.3f); path.lineTo(x-s*.8f,y+s*.4f); path.lineTo(x+s*.8f,y+s*.4f); path.lineTo(x+s,y-s*.3f); path.lineTo(x+s*.3f,y); path.lineTo(x,y-s*.65f); path.lineTo(x-s*.3f,y); path.close()
                  c.drawPath(path,p); round(c,x-s*.9f,y+s*.42f,x+s*.9f,y+s*.62f,s*.08f,gold)
              }
              private fun drawPiece(c:Canvas,a:Piece,cx:Float,cy:Float,u:Float,alpha:Float=1f) {
                  val sx=cx-w(a)*u/2f; val sy=cy-h(a)*u/2f
                  for((x,y) in a.cells) {
                      val l=sx+x*u+1; val t=sy+y*u+1
                      p.alpha=(255*alpha).toInt()
                      round(c,l+1,t+3,l+u-2,t+u-1,u*.12f,Color.argb(105,0,0,0))
                      drawBlock(c,l,t,u-3,u-4,a.color,alpha)
                      p.alpha=255
                  }
              }

              private fun drawBlock(c:Canvas,l:Float,t:Float,w:Float,h:Float,color:Int,alpha:Float=1f) {
                  val radius=min(w,h)*.12f
                  p.shader=null
                  p.color=Color.argb((115*alpha).toInt(),0,0,0)
                  c.drawRoundRect(RectF(l+1,t+2,l+w,t+h+1),radius,radius,p)
                  p.shader=LinearGradient(l,t,l,t+h,light(color,45),light(color,-42),Shader.TileMode.CLAMP)
                  p.alpha=(255*alpha).toInt()
                  c.drawRoundRect(RectF(l,t,l+w-1,t+h-1),radius,radius,p)
                  p.shader=null
                  p.color=Color.argb((100*alpha).toInt(),255,255,255)
                  p.style=Paint.Style.STROKE;p.strokeWidth=maxOf(1f,w*.018f)
                  c.drawRoundRect(RectF(l+1,t+1,l+w-2,t+h-2),radius,radius,p)
                  p.style=Paint.Style.FILL
                  p.color=Color.argb((185*alpha).toInt(),255,255,255)
                  c.drawRoundRect(RectF(l+w*.09f,t+h*.07f,l+w*.88f,t+h*.22f),radius*.6f,radius*.6f,p)
                  p.color=Color.argb((65*alpha).toInt(),255,255,255)
                  c.drawRoundRect(RectF(l+w*.08f,t+h*.10f,l+w*.19f,t+h*.82f),radius*.5f,radius*.5f,p)
                  p.alpha=255
              }
              private fun origin(a:Piece,x:Float,y:Float)=(((y-top)/unit-h(a)/2f).toInt() to ((x-left)/unit-w(a)/2f).toInt())
              private fun can(a:Piece,r:Int,col:Int):Boolean = r>=0 && col>=0 && a.cells.all { (x,y)->r+y in 0..7 && col+x in 0..7 && board[r+y][col+x]==0 }

              override fun onTouchEvent(e:MotionEvent):Boolean {
                  when(e.action) {
                      MotionEvent.ACTION_DOWN -> {
                          if(settings||scores||over) return true
                          if(gearHit.contains(e.x,e.y)) { settings=true; invalidate(); return true }
                          if(e.y<height*.075f && e.x<width*.28f) { scores=true; invalidate(); return true }
                          if(e.y>=trayTop && e.y<=trayBottom) {
                              val i=(e.x/(width/3f)).toInt().coerceIn(0,2)
                              if(pieces[i].cells.isNotEmpty()) { dragging=i; dx=e.x; dy=e.y; parent?.requestDisallowInterceptTouchEvent(true); invalidate() }
                          }; return true
                      }
                      MotionEvent.ACTION_MOVE -> { if(dragging>=0){dx=e.x;dy=e.y;invalidate()}; return true }
                      MotionEvent.ACTION_UP -> {
                          if(settings) {
                              when {
                                  closeHit.contains(e.x,e.y)->settings=false
                                  soundHit.contains(e.x,e.y)->{sound=!sound;prefs.edit().putBoolean("sound_on",sound).apply(); beep()}
                                  vibrationHit.contains(e.x,e.y)->{vibration=!vibration;prefs.edit().putBoolean("vibration_on",vibration).apply()}
                                  restartHit.contains(e.x,e.y)->newGame()
                                  else->if(e.y<height*.25f||e.y>height*.75f) settings=false
                              }; invalidate(); return true
                          }
                          if(scores){scores=false;invalidate();return true}
                          if(over){newGame();return true}
                          if(dragging>=0) {
                              val i=dragging; val a=pieces[i]; val o=origin(a,e.x,e.y)
                              if(e.x>=left&&e.x<=left+size&&e.y>=top&&e.y<=top+size&&can(a,o.first,o.second)) put(i,o.first,o.second)
                              dragging=-1;invalidate();return true
                          }; return true
                      }
                      MotionEvent.ACTION_CANCEL->{dragging=-1;invalidate();return true}
                  }; return true
              }

              private fun put(i:Int,r:Int,col:Int) {
                  val a=pieces[i]; if(!can(a,r,col))return
                  for((x,y) in a.cells) board[r+y][col+x]=a.color
                  score+=a.cells.size
                  val rows=(0..7).filter{rr->(0..7).all{board[rr][it]!=0}}
                  val cols=(0..7).filter{cc->(0..7).all{board[it][cc]!=0}}
                  for(rr in rows)for(cc in 0..7)board[rr][cc]=0
                  for(cc in cols)for(rr in 0..7)board[rr][cc]=0
                  val cleared=rows.size+cols.size
                  if(cleared>0){score+=cleared*10+if(cleared>=2)cleared*5 else 0;beep();vibrate()}
                  if(score>best){best=score;prefs.edit().putInt("best_score",best).apply()}
                  pieces[i]=Piece(emptyList(),a.color)
                  if(pieces.all{it.cells.isEmpty()})for(k in 0..2)pieces[k]=randomPiece()
                  if(pieces.filter{it.cells.isNotEmpty()}.none{a2->(0..7).any{rr->(0..7).any{cc->can(a2,rr,cc)}}}) {
                      over=true; history=(history+score).sortedDescending().take(5)
                      prefs.edit().putString("history",history.joinToString(",")).apply()
                  }
              }

              private fun drawSettings(c:Canvas) {
                  p.color=Color.argb(195,8,13,36);c.drawRect(0f,0f,width.toFloat(),height.toFloat(),p)
                  val l=width*.09f;val r=width*.91f;val t=height*.29f;val b=height*.70f
                  round(c,l,t,r,b,26f,Color.rgb(248,250,255))
                  round(c,l,t,r,t+height*.095f,24f,Color.rgb(232,239,255))
                  text(c,"SETTINGS",width*.5f,t+height*.060f,width*.055f,boardColor,true,Paint.Align.CENTER)
                  closeHit.set(r-width*.16f,t+height*.018f,r-width*.035f,t+height*.085f)
                  round(c,closeHit.left,closeHit.top,closeHit.right,closeHit.bottom,closeHit.height()*.4f,Color.WHITE)
                  text(c,"✕",closeHit.centerX(),closeHit.centerY()+width*.012f,width*.036f,boardColor,true,Paint.Align.CENTER)
                  text(c,"Sound effects",l+width*.07f,t+height*.145f,width*.038f,boardColor,true,Paint.Align.LEFT)
                  soundHit.set(r-width*.25f,t+height*.112f,r-width*.06f,t+height*.177f);toggle(c,soundHit,sound)
                  text(c,"Vibration",l+width*.07f,t+height*.235f,width*.038f,boardColor,true,Paint.Align.LEFT)
                  vibrationHit.set(r-width*.25f,t+height*.202f,r-width*.06f,t+height*.267f);toggle(c,vibrationHit,vibration)
                  restartHit.set(width*.20f,t+height*.292f,width*.80f,t+height*.365f)
                  round(c,restartHit.left,restartHit.top,restartHit.right,restartHit.bottom,18f,palette[0])
                  text(c,"NEW GAME",width*.5f,restartHit.centerY()+width*.014f,width*.039f,Color.WHITE,true,Paint.Align.CENTER)
              }
              private fun toggle(c:Canvas,r:RectF,on:Boolean) {
                  round(c,r.left,r.top,r.right,r.bottom,r.height()/2,if(on)palette[2] else Color.LTGRAY)
                  p.color=Color.WHITE;c.drawCircle(if(on)r.right-r.height()*.45f else r.left+r.height()*.45f,r.centerY(),r.height()*.36f,p)
                  text(c,if(on)"ON" else "OFF",if(on)r.left+r.width()*.25f else r.right-r.width()*.25f,r.centerY()+r.height()*.12f,r.height()*.30f,Color.WHITE,true,Paint.Align.CENTER)
              }
              private fun drawScores(c:Canvas) {
                  p.color=Color.argb(195,8,13,36);c.drawRect(0f,0f,width.toFloat(),height.toFloat(),p)
                  val l=width*.09f;val r=width*.91f;val t=height*.32f;val b=height*.66f
                  round(c,l,t,r,b,26f,Color.WHITE);crown(c,width*.5f,t+height*.06f,width*.04f)
                  text(c,"HIGH SCORES",width*.5f,t+height*.115f,width*.052f,boardColor,true,Paint.Align.CENTER)
                  if(history.isEmpty()) text(c,"Play a game to set your record!",width*.5f,t+height*.20f,width*.032f,blue,false,Paint.Align.CENTER)
                  else history.forEachIndexed{idx,v->text(c,(idx+1).toString()+".       "+v,width*.5f,t+height*(.18f+idx*.045f),width*.038f,boardColor,idx==0,Paint.Align.CENTER)}
                  text(c,"TAP TO CLOSE",width*.5f,b-height*.025f,width*.026f,blue,true,Paint.Align.CENTER)
              }
              private fun drawOver(c:Canvas) {
                  p.color=Color.argb(195,8,13,36);c.drawRect(0f,0f,width.toFloat(),height.toFloat(),p)
                  val l=width*.09f;val r=width*.91f;val t=height*.36f;val b=height*.62f
                  round(c,l,t,r,b,26f,Color.WHITE);text(c,"GAME OVER",width*.5f,t+height*.065f,width*.067f,boardColor,true,Paint.Align.CENTER)
                  text(c,"Score  "+score+"     Best  "+best,width*.5f,t+height*.12f,width*.038f,blue,true,Paint.Align.CENTER)
                  round(c,width*.22f,t+height*.155f,width*.78f,t+height*.22f,18f,palette[0])
                  text(c,"PLAY AGAIN",width*.5f,t+height*.198f,width*.04f,Color.WHITE,true,Paint.Align.CENTER)
              }
              private fun newGame() {
                  for(r in 0..7)board[r].fill(0)
                  score=0;over=false;settings=false;scores=false;dragging=-1
                  for(i in 0..2)pieces[i]=randomPiece()
                  invalidate()
              }
              private fun beep(){if(sound)try{tone?.startTone(ToneGenerator.TONE_PROP_BEEP,70)}catch(_:Exception){}}
              private fun vibrate(){
                  if(!vibration)return
                  try{@Suppress("DEPRECATION") val v=context.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      if(v!=null&&v.hasVibrator()){if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.O)v.vibrate(VibrationEffect.createOneShot(45,VibrationEffect.DEFAULT_AMPLITUDE))else{@Suppress("DEPRECATION") v.vibrate(45)}}
                  }catch(_:Exception){}
              }
              private fun round(c:Canvas,l:Float,t:Float,r:Float,b:Float,rad:Float,color:Int){p.shader=null;p.style=Paint.Style.FILL;p.color=color;p.alpha=255;c.drawRoundRect(RectF(l,t,r,b),rad,rad,p)}
              private fun text(c:Canvas,s:String,x:Float,y:Float,sz:Float,color:Int,bold:Boolean,align:Paint.Align){p.shader=null;p.color=color;p.alpha=255;p.textSize=sz;p.typeface=Typeface.create("sans-serif",if(bold)Typeface.BOLD else Typeface.NORMAL);p.textAlign=align;c.drawText(s,x,y,p)}
              private fun light(color:Int,n:Int)=Color.rgb((Color.red(color)+n).coerceIn(0,255),(Color.green(color)+n).coerceIn(0,255),(Color.blue(color)+n).coerceIn(0,255))
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text().replace('android:label="Block Blast"', 'android:label="Daveblast"')
          p.write_text(s)
          print("Installed Daveblast visual redesign, settings, high scores, and drag controls")
          PY

      - name: Add Block Blast launcher icon
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path("app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              candidates = list(Path(".").glob("**/src/main/AndroidManifest.xml"))
              candidates = [p for p in candidates if ".gradle" not in str(p)]
              if not candidates:
                  raise SystemExit("AndroidManifest.xml not found")
              manifest = candidates[0]

          res = manifest.parent / "res"
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)

          icon = drawable / "ic_launcher.xml"
          icon.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#101820" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#F9C80E" android:pathData="M18,18h30v30h-30z"/>
              <path android:fillColor="#F86624" android:pathData="M54,18h36v18h-36z"/>
              <path android:fillColor="#EA3546" android:pathData="M54,42h18v30h-18z"/>
              <path android:fillColor="#43BCCD" android:pathData="M18,54h30v18h-30z"/>
              <path android:fillColor="#43BCCD" android:pathData="M18,78h18v12h-18z"/>
              <path android:fillColor="#7CB518" android:pathData="M42,78h48v12h-48z"/>
              <path android:fillColor="#F86624" android:pathData="M78,42h12v30h-12z"/>
          </vector>
          """, encoding="utf-8")

          text = manifest.read_text(encoding="utf-8")
          app_match = re.search(r"<application\b[^>]*>", text, re.S)
          if not app_match:
              raise SystemExit("Could not find application tag in AndroidManifest.xml")
          tag = app_match.group(0)
          tag = re.sub(r'\s+android:icon="[^"]*"', "", tag)
          tag = re.sub(r'\s+android:roundIcon="[^"]*"', "", tag)
          tag = tag[:-1] + ' android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher">'
          text = text[:app_match.start()] + tag + text[app_match.end():]
          manifest.write_text(text, encoding="utf-8")
          print(f"Launcher icon added and manifest updated: {manifest}")
          PY

      - name: Diagnose launcher and app startup code
        shell: bash
        run: |
          echo "=== Android manifest ==="
          for file in $(find . -path '*/src/main/AndroidManifest.xml' -not -path '*/.gradle/*'); do
            echo "=== MANIFEST: $file ==="
            sed -n '1,220p' "$file"
          done
          echo "=== App source files ==="
          find app/src/main -type f -name '*.kt' -print
          find app/src/main -type f -name '*.java' -print
          while IFS= read -r file; do
            echo "=== SOURCE: $file ==="
            sed -n '1,260p' "$file"
          done < <(find app/src/main -type f \( -name '*.kt' -o -name '*.java' \) -not -path '*/.gradle/*' | head -20)

      - name: Find Android project
        run: |
          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "Searching for Android project..."
            find . -type f \( \
              -name build.gradle -o \
              -name build.gradle.kts \
            \) -not -path '*/.gradle/*'
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts was not found."
            echo "Check that the Android project files are uploaded."
            exit 1
          fi

      - name: Fix Java and Kotlin JVM targets
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("app/build.gradle.kts"),
              Path("app/build.gradle")
          ]

          build_file = next(
              (p for p in candidates if p.is_file()),
              None
          )

          if build_file is None:
              raise SystemExit("App Gradle file not found")

          text = build_file.read_text()

          if build_file.suffix == ".kts":
              block = """compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }"""
          else:
              block = """compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }"""

          pattern = r"compileOptions\s*\{[^}]*\}"

          if re.search(pattern, text, re.S):
              text = re.sub(
                  pattern,
                  lambda _: block,
                  text,
                  count=1,
                  flags=re.S
              )
          else:
              match = re.search(r"\bandroid\s*\{", text)

              if not match:
                  raise SystemExit(
                      "Could not find the Android Gradle block"
                  )

              text = (
                  text[:match.end()]
                  + "\n    "
                  + block
                  + "\n"
                  + text[match.end():]
              )

          # Align Kotlin JVM target when the Kotlin DSL is used.
          if build_file.suffix == ".kts":
              kotlin_pattern = (
                  r"kotlinOptions\s*\{[^}]*\}"
              )

              kotlin_block = """kotlinOptions {
                  jvmTarget = "17"
              }"""

              if re.search(kotlin_pattern, text, re.S):
                  text = re.sub(
                      kotlin_pattern,
                      lambda _: kotlin_block,
                      text,
                      count=1,
                      flags=re.S
                  )

          build_file.write_text(text)
          print("Updated:", build_file)
          print("Java compatibility target: 17")
          PY

      - name: Enforce matching Java and Kotlin JVM targets
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          candidates = [Path("app/build.gradle"), Path("app/build.gradle.kts")]
          build_file = next((p for p in candidates if p.is_file()), None)
          if build_file is None:
              raise SystemExit("App Gradle file not found")

          text = build_file.read_text()
          if build_file.suffix == ".kts":
              snippet = """
          // Keep Java and Kotlin bytecode targets aligned for CI builds.
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          else:
              snippet = """
          // Keep Java and Kotlin bytecode targets aligned for CI builds.
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          if "Keep Java and Kotlin bytecode targets aligned for CI builds." not in text:
              text += "\n" + snippet + "\n"
          build_file.write_text(text)
          print(f"Enforced Kotlin JVM target 17 in {build_file}")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Do not request the removed legacy "tools" SDK package.
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Name APK Daveblast.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Daveblast.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daveblast-APK
          path: app/build/outputs/apk/debug/Daveblast.apk
          if-no-files-found: error
          retention-days: 7
