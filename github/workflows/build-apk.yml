name: Build Daveblast APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          if [ -f BlockBlastAndroidProject.zip ]; then
            unzip -o BlockBlastAndroidProject.zip -d .
          fi

      - name: Install redesigned Daveblast game (iPhone-style UI, combos, Android insets)
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/blockblast
          cat > app/src/main/java/com/example/blockblast/MainActivity.kt <<'KOTLIN'
          package com.example.blockblast

          import android.app.Activity
          import android.content.Context
          import android.content.pm.ActivityInfo
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.os.Build
          import android.os.Bundle
          import android.os.SystemClock
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowManager
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.random.Random

          class MainActivity : Activity() {
              private var game: DaveblastView? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                  actionBar?.hide()
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.setBackgroundDrawable(ColorDrawable(Color.rgb(39, 61, 119)))
                  setupEdgeToEdge()
                  val v = DaveblastView(this)
                  game = v
                  setContentView(v)
              }

              @Suppress("DEPRECATION")
              private fun setupEdgeToEdge() {
                  window.statusBarColor = Color.TRANSPARENT
                  window.navigationBarColor = Color.TRANSPARENT
                  if (Build.VERSION.SDK_INT >= 29) {
                      window.isNavigationBarContrastEnforced = false
                      window.isStatusBarContrastEnforced = false
                  }
                  if (Build.VERSION.SDK_INT >= 30) {
                      window.setDecorFitsSystemWindows(false)
                  } else {
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  }
                  if (Build.VERSION.SDK_INT >= 28) {
                      val lp = window.attributes
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      window.attributes = lp
                  }
              }

              @Suppress("DEPRECATION", "OVERRIDE_DEPRECATION")
              override fun onBackPressed() {
                  if (game?.handleBack() != true) super.onBackPressed()
              }
          }

          internal data class DbPiece(val cells: List<Pair<Int, Int>>, val color: Int) {
              val w: Int = (cells.maxOfOrNull { it.first } ?: -1) + 1
              val h: Int = (cells.maxOfOrNull { it.second } ?: -1) + 1
          }

          private val SHAPE_DEFS = listOf(
              "#",
              "##", "#/#",
              "###", "#/#/#",
              "####", "#/#/#/#",
              "#####", "#/#/#/#/#",
              "##/##", "###/###", "##/##/##", "###/###/###",
              "#./#./##", ".#/.#/##", "##/#./#.", "##/.#/.#",
              "###/#..", "###/..#", "#../###", "..#/###",
              "###/.#.", ".#./###", "#./##/#.", ".#/##/.#",
              "##./.##", ".##/##.", "#./##/.#", ".#/##/#.",
              "##/#.", "##/.#", "#./##", ".#/##",
              "#../#../###", "###/#../#..", "..#/..#/###", "###/..#/..#"
          )

          private fun parseShape(def: String): List<Pair<Int, Int>> {
              val out = ArrayList<Pair<Int, Int>>()
              def.split("/").forEachIndexed { y, row ->
                  row.forEachIndexed { x, ch -> if (ch == '#') out.add(Pair(x, y)) }
              }
              return out
          }

          internal class DaveblastView(context: Context) : View(context) {

              private class ClearCell(val r: Int, val c: Int, val color: Int, val t0: Long, val delay: Long)
              private class Particle(
                  val x0: Float, val y0: Float, val vx: Float, val vy: Float,
                  val color: Int, val t0: Long, val life: Long, val size: Float
              )
              private class Popup(val text: String, val sub: String?, val color: Int, val t0: Long)

              private companion object {
                  const val CLEAR_MS = 340L
                  const val POPUP_MS = 1150L
              }

              // ---------- look ----------
              private val prefs = context.getSharedPreferences("daveblast_scores", Context.MODE_PRIVATE)
              private val navy = Color.rgb(25, 35, 79)
              private val boardColor = Color.rgb(27, 38, 88)
              private val cellColor = Color.rgb(38, 53, 109)
              private val gold = Color.rgb(255, 196, 48)
              private val muted = Color.rgb(98, 116, 176)
              private val palette = listOf(
                  Color.rgb(47, 111, 255), Color.rgb(255, 151, 35), Color.rgb(42, 208, 102),
                  Color.rgb(183, 75, 244), Color.rgb(246, 66, 76), Color.rgb(34, 202, 222),
                  Color.rgb(255, 202, 55)
              )
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val bgPaint = Paint()
              private val glowPaint = Paint()
              private val rf = RectF()
              private val crownPath = Path()
              private val heavy: Typeface = Typeface.create("sans-serif-black", Typeface.NORMAL)
              private val medium: Typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)

              // ---------- game state ----------
              private val board = Array(8) { IntArray(8) }
              private val pieces = MutableList(3) { DbPiece(emptyList(), 0) }
              private val placeable = BooleanArray(3)
              private val pmask = Array(8) { BooleanArray(8) }
              private val prevRows = BooleanArray(8)
              private val prevCols = BooleanArray(8)
              private var prevValid = false
              private var prevR = 0
              private var prevC = 0

              private val shapes = SHAPE_DEFS.map { parseShape(it) }
              private val shapeWeights = shapes.map {
                  when (it.size) {
                      1 -> 1
                      2 -> 3
                      3 -> 4
                      4 -> 4
                      5 -> 3
                      else -> 1
                  }
              }
              private val totalWeight = shapeWeights.sum()

              private var score = 0
              private var shown = 0f
              private var best = prefs.getInt("best_score", 0)
              private var startBest = best
              private var sound = prefs.getBoolean("sound_on", true)
              private var vibration = prefs.getBoolean("vibration_on", true)
              private var history: List<Int> = (prefs.getString("history", "") ?: "")
                  .split(",").mapNotNull { it.toIntOrNull() }.sortedDescending().take(5)
              private var streak = 0
              private var quiet = 0

              private var settings = false
              private var scores = false
              private var over = false
              private var overT0 = 0L
              private var overlayT0 = 0L
              private var spawnT0 = 0L
              private var scorePopT = 0L

              private var dragging = -1
              private var dx = 0f
              private var dy = 0f
              private var dragT0 = 0L
              private var downGear = false
              private var downScores = false

              private val fx = ArrayList<ClearCell>()
              private val particles = ArrayList<Particle>()
              private var popup: Popup? = null

              // ---------- layout ----------
              private var insetTop = 0f
              private var insetBottom = 0f
              private var contentTop = 0f
              private var contentH = 0f
              private var topCy = 0f
              private var gearCx = 0f
              private var gearR = 0f
              private var scoreY = 0f
              private var titleY = 0f
              private var left = 0f
              private var top = 0f
              private var size = 0f
              private var unit = 0f
              private var trayUnit = 0f
              private var trayCy = 0f
              private var trayHitTop = 0f
              private val gearHit = RectF()
              private val scoresHit = RectF()
              private val closeHit = RectF()
              private val soundHit = RectF()
              private val vibHit = RectF()
              private val restartHit = RectF()
              private val playHit = RectF()
              private val panelRect = RectF()

              private var tone: ToneGenerator? = try {
                  ToneGenerator(AudioManager.STREAM_MUSIC, 55)
              } catch (ignored: Exception) {
                  null
              }

              init {
                  dealPieces()
              }

              // ---------- window plumbing ----------
              @Suppress("DEPRECATION")
              override fun onApplyWindowInsets(insets: WindowInsets): WindowInsets {
                  if (Build.VERSION.SDK_INT >= 30) {
                      val b = insets.getInsets(WindowInsets.Type.systemBars() or WindowInsets.Type.displayCutout())
                      insetTop = b.top.toFloat()
                      insetBottom = b.bottom.toFloat()
                  } else {
                      insetTop = insets.systemWindowInsetTop.toFloat()
                      insetBottom = insets.systemWindowInsetBottom.toFloat()
                  }
                  invalidate()
                  return insets
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  requestApplyInsets()
              }

              override fun onDetachedFromWindow() {
                  super.onDetachedFromWindow()
                  try {
                      tone?.release()
                  } catch (ignored: Exception) {
                  }
                  tone = null
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  bgPaint.shader = LinearGradient(
                      0f, 0f, 0f, h.toFloat(),
                      Color.rgb(74, 114, 202), Color.rgb(36, 58, 124), Shader.TileMode.CLAMP
                  )
                  glowPaint.shader = RadialGradient(
                      w * .5f, h * .38f, max(w, h) * .62f,
                      Color.argb(70, 150, 190, 255), Color.argb(0, 150, 190, 255), Shader.TileMode.CLAMP
                  )
              }

              fun handleBack(): Boolean {
                  if (settings || scores) {
                      settings = false
                      scores = false
                      invalidate()
                      return true
                  }
                  return false
              }

              private fun layout() {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val d = resources.displayMetrics.density
                  contentTop = insetTop + 6f * d
                  contentH = h - contentTop - insetBottom - 8f * d
                  val a = contentH
                  topCy = contentTop + a * .045f
                  gearR = w * .036f
                  gearCx = w - w * .085f
                  val gh = gearR * 2.3f
                  gearHit.set(gearCx - gh, topCy - gh, gearCx + gh, topCy + gh)
                  scoresHit.set(0f, contentTop, w * .42f, topCy + gh)
                  scoreY = contentTop + a * .125f
                  titleY = contentTop + a * .158f
                  size = min(w * .94f, a * .46f)
                  unit = size / 8f
                  left = (w - size) / 2f
                  top = contentTop + a * .195f
                  val boardBottom = top + size
                  val bottomLimit = contentTop + a
                  trayUnit = min(unit * .62f, (w / 3f) * .8f / 3f)
                  trayCy = boardBottom + (bottomLimit - boardBottom) * .46f
                  trayHitTop = boardBottom - unit * .2f
              }

              // ---------- small helpers ----------
              private fun wa(color: Int, a: Float): Int =
                  (color and 0x00FFFFFF) or ((a.coerceIn(0f, 1f) * 255f).toInt() shl 24)

              private fun light(color: Int, amt: Int): Int = Color.rgb(
                  (Color.red(color) + amt).coerceIn(0, 255),
                  (Color.green(color) + amt).coerceIn(0, 255),
                  (Color.blue(color) + amt).coerceIn(0, 255)
              )

              private fun ease(t: Float): Float = 1f - (1f - t) * (1f - t)

              private fun backOut(t: Float): Float {
                  val c1 = 1.70158f
                  val c3 = c1 + 1f
                  val u = t - 1f
                  return 1f + c3 * u * u * u + c1 * u * u
              }

              private fun lift(): Float = unit * 1.9f
              private fun slotCx(i: Int): Float = width / 3f * (i + .5f)

              private fun randomShape(): List<Pair<Int, Int>> {
                  var r = Random.nextInt(totalWeight)
                  for (i in shapes.indices) {
                      r -= shapeWeights[i]
                      if (r < 0) return shapes[i]
                  }
                  return shapes[0]
              }

              private fun randomPiece() = DbPiece(randomShape(), palette.random())

              private fun can(a: DbPiece, r: Int, col: Int): Boolean =
                  a.cells.isNotEmpty() && r >= 0 && col >= 0 &&
                      a.cells.all { (x, y) -> r + y in 0..7 && col + x in 0..7 && board[r + y][col + x] == 0 }

              private fun canAnywhere(a: DbPiece): Boolean =
                  a.cells.isNotEmpty() && (0..7).any { rr -> (0..7).any { cc -> can(a, rr, cc) } }

              private fun refreshPlaceable() {
                  for (i in 0..2) placeable[i] = canAnywhere(pieces[i])
              }

              private fun dealPieces() {
                  var tries = 0
                  do {
                      for (k in 0..2) pieces[k] = randomPiece()
                      tries++
                  } while (tries < 40 && pieces.none { canAnywhere(it) })
                  spawnT0 = SystemClock.uptimeMillis()
                  refreshPlaceable()
              }

              private fun origin(a: DbPiece, cx: Float, cy: Float): Pair<Int, Int> = Pair(
                  ((cy - top) / unit - a.h / 2f).roundToInt(),
                  ((cx - left) / unit - a.w / 2f).roundToInt()
              )

              private fun computePreview() {
                  prevValid = false
                  prevRows.fill(false)
                  prevCols.fill(false)
                  for (rr in 0..7) pmask[rr].fill(false)
                  if (dragging < 0) return
                  val a = pieces[dragging]
                  val o = origin(a, dx, dy - lift())
                  if (!can(a, o.first, o.second)) return
                  prevValid = true
                  prevR = o.first
                  prevC = o.second
                  for ((x, y) in a.cells) pmask[o.first + y][o.second + x] = true
                  for (rr in 0..7) prevRows[rr] = (0..7).all { board[rr][it] != 0 || pmask[rr][it] }
                  for (cc in 0..7) prevCols[cc] = (0..7).all { board[it][cc] != 0 || pmask[it][cc] }
              }

              // ---------- drawing ----------
              override fun onDraw(c: Canvas) {
                  super.onDraw(c)
                  if (width == 0 || height == 0) return
                  layout()
                  val now = SystemClock.uptimeMillis()
                  val w = width.toFloat()
                  val h = height.toFloat()
                  var anim = false

                  c.drawRect(0f, 0f, w, h, bgPaint)
                  c.drawRect(0f, 0f, w, h, glowPaint)

                  // top bar
                  crown(c, w * .075f, topCy, w * .042f)
                  txt(c, best.toString(), w * .125f, topCy + w * .018f, w * .05f, gold, Paint.Align.LEFT)
                  gear(c, gearCx, topCy, gearR)

                  // score
                  if (shown > score) shown = score.toFloat()
                  if (shown < score) {
                      shown = min(score.toFloat(), shown + max(1f, (score - shown) * .16f))
                      anim = true
                  }
                  val pop = max(0f, 1f - (now - scorePopT) / 240f)
                  if (pop > 0f) anim = true
                  val scoreSize = min(w * .13f, contentH * .06f) * (1f + .16f * pop)
                  txt(c, shown.toInt().toString(), w / 2f, scoreY, scoreSize, Color.WHITE, shadow = true)
                  txt(
                      c, "DAVEBLAST", w / 2f, titleY, w * .034f, Color.argb(225, 215, 226, 255),
                      spacing = .28f
                  )

                  // board
                  computePreview()
                  val pad = unit * .08f
                  fillRound(c, left - pad, top - pad + 6f, left + size + pad, top + size + pad + 10f, w * .035f, Color.argb(70, 5, 10, 40))
                  fillRound(c, left - pad - 3f, top - pad - 3f, left + size + pad + 3f, top + size + pad + 3f, w * .035f, Color.rgb(88, 118, 200))
                  fillRound(c, left - pad, top - pad, left + size + pad, top + size + pad, w * .03f, boardColor)

                  val gap = unit * .045f
                  val s = unit - gap * 2f
                  val dragColor = if (dragging >= 0) pieces[dragging].color else 0
                  for (r in 0..7) for (col in 0..7) {
                      val x = left + col * unit + gap
                      val y = top + r * unit + gap
                      val v = board[r][col]
                      val hl = prevValid && (prevRows[r] || prevCols[col])
                      if (v != 0) {
                          drawBlock(c, x, y, s, if (hl) dragColor else v)
                      } else {
                          fillRound(c, x, y, x + s, y + s, s * .16f, cellColor)
                      }
                  }

                  // clearing blocks
                  if (fx.isNotEmpty()) {
                      anim = true
                  
